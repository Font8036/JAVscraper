[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "javscraper"
version = "0.4.5"
description = "文件名刮削与文件整理工具，支持插件扩展"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Font8036" },
]
keywords = [
    "scraper",
    "file-management",
    "tkinter",
    "javdb",
    "subtitlecat",
    "jellyfin",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# 核心零第三方依赖
dependencies = []

[project.optional-dependencies]
# 爬虫插件（web_scraper）所需的依赖。
# 内含多个源：JavDB 信息、字幕猫。
# 装完还需要执行一次：playwright install msedge
web_scraper = [
    "playwright>=1.40",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "httpx>=0.27",
    "Pillow>=10.0",
]

# Jellyfin NFO 插件所需的依赖。
jellyfin = [
    "openpyxl>=3.1",
]

# 完整版：核心 + 所有插件依赖
full = [
    "playwright>=1.40",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "httpx>=0.27",
    "Pillow>=10.0",
]

# 开发 / 打包用
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

# 全部：完整版 + 开发工具
all = [
    "playwright>=1.40",
    "openpyxl>=3.1",
    "xlsxwriter>=3.1",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Font8036/JAVscraper"
Repository = "https://github.com/Font8036/JAVscraper"
Issues = "https://github.com/Font8036/JAVscraper/issues"

[project.scripts]
# 命令行入口
av-scraper = "av_scraper.__main__:main"

[project.gui-scripts]
# GUI 入口（Windows 上启动时不弹控制台）
javscraper = "av_scraper.__main__:main"

[tool.setuptools]
# 只把 av_scraper 包打进 wheel，plugins/ 独立分发

[tool.setuptools.packages.find]
include = ["av_scraper*"]
exclude = ["plugins*", "test*"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "plugins",
    "test",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # 行太长由 ruff format 处理
]

[tool.ruff.lint.per-file-ignores]
# 入口脚本必须先把项目根 / plugins 塞进 sys.path 再 import（详见文件里的注释），
# 所以 E402 是结构上无法避免的；run_full.py 的 import 还按插件分组排列，
# 好让 PyInstaller 静态分析不漏插件，因此也不按 isort 排序。
"run_full.py" = ["E402", "I001"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# 让直接跑 `pytest`（而不只是 `python -m pytest`）也能 import 到仓库根目录下的 av_scraper
pythonpath = ["."]