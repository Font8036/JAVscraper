[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "javscraper"
version = "0.2.2"
description = "文件名刮削与文件整理工具，支持插件扩展"
readme = "readme.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Font8036" },
]
keywords = [
    "scraper",
    "file-management",
    "tkinter",
    "javdb",
    "plugin",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

# 核心零第三方依赖
dependencies = []

[project.optional-dependencies]
# JavDB 插件所需的依赖。装了这个才能用「④ JavDB 刮削」标签页。
# 装完还需要执行一次：playwright install msedge
javdb = [
    "playwright>=1.40",
    "pandas>=2.0",
    "xlsxwriter>=3.1",
    "httpx>=0.27",
    "Pillow>=10.0",
]

# 开发 / 打包用
dev = [
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

# 全部：核心 + 所有插件 + 开发工具
all = [
    "playwright>=1.40",
    "pandas>=2.0",
    "xlsxwriter>=3.1",
    "httpx>=0.27",
    "Pillow>=10.0",
    "pyinstaller>=6.0",
    "pytest>=7.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/Font8036/JAVscraper"
Repository = "https://github.com/Font8036/JAVscraper"
Issues = "https://github.com/Font8036/JAVscraper/issues"

[project.scripts]
# 命令行入口：python -m av_scraper 之外的另一种启动方式
av-scraper = "av_scraper.__main__:main"

[project.gui-scripts]
# GUI 入口（Windows 上启动时不弹控制台）
javscraper = "av_scraper.__main__:main"

[tool.setuptools]
# 只把 av_scraper 包打进 wheel，plugins/ 独立分发
packages = ["av_scraper"]

[tool.setuptools.packages.find]
include = ["av_scraper*"]
exclude = ["plugins*", "test*"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "plugins",
    "test",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # 行太长由 ruff format 处理
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]